[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation: LLM discovery, recorded capabilities, deterministic replay, human handoff."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "playwright>=1.48",
  "pydantic>=2.8",
  "aiohttp>=3.10",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
cua = "cua.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["cua*", "target_app*"]

[tool.setuptools.package-data]
cua = ["surface/probe.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/cua"]
